<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail - Univolt Power</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --brand-blue: #1a6fc4;
      --brand-blue-dark: #0f4d8a;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --accent-orange: #f97316;
      --accent-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    /* ── HEADER (copied pattern) ── */
    .header { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 100; }
    .header-content { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo img.site-logo { height: 48px; object-fit: contain; }
    .nav-desktop { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link { text-decoration: none; color: #334155; font-size: .9rem; font-weight: 500; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: var(--brand-blue); }
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.4rem; border-radius: 6px; font-weight: 600; font-size: .875rem; cursor: pointer; text-decoration: none; border: none; transition: all .2s; }
    .btn-primary { background: var(--brand-blue); color: #fff; }
    .btn-primary:hover { background: var(--brand-blue-dark); }
    .header-actions { display: flex; align-items: center; gap: .75rem; }
    .cart-button { background: none; border: none; cursor: pointer; position: relative; color: #334155; display: flex; align-items: center; }
    .cart-count { position: absolute; top: -6px; right: -6px; background: var(--brand-blue); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: .65rem; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .mobile-menu-btn { background: none; border: none; cursor: pointer; color: #334155; display: none; }
    @media(max-width:768px){ .nav-desktop{display:none;} .mobile-menu-btn{display:flex;} }
    .nav-mobile { display: none; flex-direction: column; background: #fff; padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; }
    .nav-mobile.active { display: flex; }

    /* ── CART DRAWER ── */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .cart-overlay.active { opacity: 1; pointer-events: all; }
    .cart-drawer { position: fixed; top: 0; right: 0; width: 380px; max-width: 100vw; height: 100vh; background: #fff; z-index: 201; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .cart-drawer.active { transform: translateX(0); }
    .cart-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
    .cart-title { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1.1rem; }
    .cart-close { background: none; border: none; cursor: pointer; color: #64748b; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
    .cart-item { display: flex; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid #f1f5f9; }
    .cart-item-image { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #f1f5f9; }
    .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .cart-item-name { font-size: .85rem; font-weight: 600; margin-bottom: .25rem; }
    .cart-item-qty { font-size: .75rem; color: #64748b; }
    .cart-item-price { font-size: .9rem; font-weight: 700; color: var(--brand-blue); margin-top: .25rem; }
    .cart-remove { background: none; border: none; cursor: pointer; color: #ef4444; padding: .25rem; flex-shrink: 0; }
    .cart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: #94a3b8; text-align: center; padding: 2rem; }
    .cart-footer { padding: 1.25rem 1.5rem; border-top: 1px solid #e2e8f0; }
    .cart-total { display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; }
    .btn-checkout { width: 100%; background: var(--brand-blue); color: #fff; border: none; padding: .875rem; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
    .btn-checkout:hover { background: var(--brand-blue-dark); }
    .btn-checkout:disabled { opacity: .5; cursor: not-allowed; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: .75rem 1.25rem; border-radius: 8px; display: flex; align-items: center; gap: .5rem; z-index: 300; opacity: 0; transition: all .35s cubic-bezier(.4,0,.2,1); white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-icon { color: #22c55e; flex-shrink: 0; }

    /* ═══════════════════════════════════════════
       PRODUCT DETAIL PAGE STYLES
    ═══════════════════════════════════════════ */

    /* Breadcrumb */
    .breadcrumb { max-width: 1280px; margin: 0 auto; padding: 1.25rem 1.5rem .5rem; display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: #64748b; flex-wrap: wrap; }
    .breadcrumb a { color: #64748b; text-decoration: none; transition: color .2s; }
    .breadcrumb a:hover { color: var(--brand-blue); }
    .breadcrumb-sep { color: #cbd5e1; }
    .breadcrumb-current { color: #1e293b; font-weight: 500; }

    /* Product hero section */
    .product-hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    @media(max-width: 900px) { .product-hero { grid-template-columns: 1fr; gap: 2rem; } }

    /* Gallery */
    .product-gallery { position: sticky; top: 90px; }
    .main-image-wrap {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e8f0;
      margin-bottom: 1rem;
      position: relative;
    }
    .main-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 1.5rem;
      transition: transform .4s ease;
    }
    .main-image-wrap:hover img { transform: scale(1.04); }
    .category-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--brand-blue);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: .3rem .75rem;
      border-radius: 20px;
      letter-spacing: .03em;
    }
    .thumb-row { display: flex; gap: .75rem; }
    .thumb {
      width: 72px; height: 72px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s;
      background: #fff;
      flex-shrink: 0;
    }
    .thumb:hover, .thumb.active { border-color: var(--brand-blue); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

    /* Info panel */
    .product-info { display: flex; flex-direction: column; gap: 1.5rem; }
    .product-meta { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .meta-tag { background: #eff6ff; color: var(--brand-blue); font-size: .75rem; font-weight: 600; padding: .3rem .7rem; border-radius: 20px; }
    .meta-tag.green { background: #f0fdf4; color: #16a34a; }
    .stock-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }

    .product-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1.2;
      color: #0f172a;
    }
    @media(max-width:600px){ .product-title { font-size: 1.5rem; } }

    .product-price-row { display: flex; align-items: baseline; gap: 1rem; }
    .product-price {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--brand-blue);
    }
    .product-price-note { font-size: .85rem; color: #64748b; }

    .rating-row { display: flex; align-items: center; gap: .5rem; }
    .stars { color: #f59e0b; letter-spacing: 2px; }
    .rating-count { font-size: .85rem; color: #64748b; }

    .divider { height: 1px; background: #e2e8f0; }

    .product-desc { font-size: .95rem; line-height: 1.75; color: #475569; }

    /* Specs grid */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
    }
    .spec-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: .75rem 1rem;
    }
    .spec-label { font-size: .72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .2rem; }
    .spec-value { font-size: .9rem; font-weight: 600; color: #1e293b; }

    /* Actions */
    .action-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 1.5px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .qty-btn { background: #f8fafc; border: none; width: 40px; height: 48px; font-size: 1.2rem; cursor: pointer; transition: background .15s; color: #334155; }
    .qty-btn:hover { background: #e2e8f0; }
    .qty-input { width: 48px; height: 48px; text-align: center; border: none; border-left: 1.5px solid #e2e8f0; border-right: 1.5px solid #e2e8f0; font-size: 1rem; font-weight: 600; outline: none; }
    .btn-add { flex: 1; min-width: 160px; background: var(--brand-blue); color: #fff; border: none; padding: .875rem 1.5rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem; transition: all .2s; }
    .btn-add:hover { background: var(--brand-blue-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,111,196,.3); }
    .btn-quote { background: #fff; border: 1.5px solid var(--brand-blue); color: var(--brand-blue); padding: .875rem 1.25rem; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .btn-quote:hover { background: #eff6ff; }

    /* Highlights */
    .highlights { display: flex; flex-direction: column; gap: .6rem; }
    .highlight-item { display: flex; align-items: center; gap: .75rem; font-size: .875rem; color: #475569; }
    .highlight-icon { width: 32px; height: 32px; border-radius: 8px; background: #eff6ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--brand-blue); }

    /* Tabs section */
    .tabs-section { max-width: 1280px; margin: 0 auto 4rem; padding: 0 1.5rem; }
    .tab-nav { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 2rem; overflow-x: auto; }
    .tab-btn {
      background: none; border: none; padding: .875rem 1.5rem; font-size: .9rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; white-space: nowrap;
    }
    .tab-btn.active { color: var(--brand-blue); border-bottom-color: var(--brand-blue); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Spec table */
    .spec-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .spec-table th { text-align: left; padding: .75rem 1rem; background: #f8fafc; font-weight: 700; color: #334155; border: 1px solid #e2e8f0; width: 35%; }
    .spec-table td { padding: .75rem 1rem; border: 1px solid #e2e8f0; color: #475569; }
    .spec-table tr:nth-child(even) td { background: #f8fafc; }

    /* Features list */
    .features-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media(max-width:600px){ .features-list { grid-template-columns: 1fr; } }
    .feature-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.25rem; display: flex; gap: 1rem; }
    .feature-icon { width: 40px; height: 40px; border-radius: 10px; background: #eff6ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.25rem; }
    .feature-title { font-weight: 700; font-size: .9rem; margin-bottom: .25rem; color: #1e293b; }
    .feature-desc { font-size: .8rem; color: #64748b; line-height: 1.5; }

    /* Related products */
    .related-section { background: #fff; padding: 3rem 0; border-top: 1px solid #e2e8f0; }
    .related-inner { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
    .related-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all .2s; }
    .related-card:hover { border-color: var(--brand-blue); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .related-img { height: 160px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
    .related-img img { width: 100%; height: 100%; object-fit: contain; padding: .75rem; }
    .related-info { padding: .875rem 1rem; }
    .related-name { font-size: .85rem; font-weight: 600; margin-bottom: .4rem; color: #1e293b; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .related-price { font-size: .95rem; font-weight: 800; color: var(--brand-blue); }

    /* Not found */
    .not-found { text-align: center; padding: 6rem 2rem; color: #64748b; }
    .not-found h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; color: #334155; margin-bottom: .5rem; }

    /* Footer */
    .footer { background: #0f172a; color: #94a3b8; padding: 3rem 0 1.5rem; }
    .footer-content { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    .footer-bottom { border-top: 1px solid #1e293b; margin-top: 2rem; padding-top: 1.5rem; text-align: center; font-size: .8rem; }
  </style>
</head>

function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return parseInt(params.get('id'));
}

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5;
  let s = '';
  for (let i = 0; i < full; i++) s += '★';
  if (half) s += '½';
  while (s.replace('½','').length < 5) s += '☆';
  return s;
}

function getRelatedProducts(ids) {
  return ids.map(id => PRODUCTS[id]).filter(Boolean);
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
  document.getElementById(`tab-${tabId}`).classList.add('active');
}

function adjustQty(delta) {
  const inp = document.getElementById('qty-input');
  let v = parseInt(inp.value) + delta;
  if (v < 1) v = 1;
  if (v > 99) v = 99;
  inp.value = v;
}

function addCurrentToCart(product) {
  const qty = parseInt(document.getElementById('qty-input').value) || 1;
  for (let i = 0; i < qty; i++) {
    cart.addToCart({
      id: product.id,
      name: product.name,
      price: product.priceRaw,
      category: product.category,
      image: product.image
    });
  }
}

        <button class="tab-btn" data-tab="features" onclick="switchTab('features')">Features &amp; Benefits</button>
        <button class="tab-btn" data-tab="install" onclick="switchTab('install')">Installation &amp; Support</button>
      </div>

      <div id="tab-specs" class="tab-panel active">
        <table class="spec-table">
          <tbody>
            ${product.specs.map(([label, val]) => `
              <tr><th>${label}</th><td>${val}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div id="tab-features" class="tab-panel">
        <div class="features-list">
          ${(product.features || []).map(f => `
            <div class="feature-card">
              <div class="feature-icon">${f.icon}</div>
              <div>
                <div class="feature-title">${f.title}</div>
                <div class="feature-desc">${f.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div id="tab-install" class="tab-panel">
        <div style="max-width:640px;line-height:1.8;color:#475569;font-size:.95rem;">
          <h3 style="font-family:'Syne',sans-serif;color:#1e293b;margin-bottom:1rem;">Installation & After-Sales Support</h3>
          <p style="margin-bottom:1rem;">Univolt Power provides end-to-end installation services for all products sold through our platform. Our certified technicians are available in Nairobi, Mombasa, Kisumu, Nakuru and major towns across Kenya.</p>
          <h4 style="color:#1e293b;margin:.75rem 0 .35rem;">What's included with your purchase:</h4>
          <ul style="padding-left:1.25rem;margin-bottom:1rem;">
            <li>Free pre-installation site assessment (within Nairobi)</li>
            <li>Professional installation by certified engineers</li>
            <li>System commissioning and performance testing</li>
            <li>Monitoring setup and app configuration</li>
            <li>1-year workmanship warranty on all installations</li>
          </ul>
          <h4 style="color:#1e293b;margin:.75rem 0 .35rem;">Contact our technical team:</h4>
          <p>📞 Call/WhatsApp: <strong>+254 700 000 000</strong><br>
          📧 Email: <strong>info@univoltpower.com</strong><br>
          🕒 Hours: Mon–Fri 8am–6pm | Sat 9am–4pm</p>
        </div>
      </div>
    </div>

    <!-- Related Products -->
    ${related.length > 0 ? `
    <div class="related-section">
      <div class="related-inner">
        <h2 class="section-title">You Might Also Like</h2>
        <div class="related-grid">
          ${related.map(rp => `
            <div class="related-card" onclick="window.location.href='productdetail.html?id=${rp.id}'">
              <div class="related-img"><img src="${rp.image}" alt="${rp.name}" onerror="this.src='https://via.placeholder.com/200x160'"></div>
              <div class="related-info">
                <div class="related-name">${rp.name}</div>
                <div class="related-price">${rp.price}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    ` : ''}
  `;
}

function switchImage(src, thumbEl) {
  document.getElementById('main-img').src = src;
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  thumbEl.classList.add('active');
}

function renderNotFound(id) {
  return `
    <div class="not-found">
      <svg width="64" height="64" fill="none" stroke="#cbd5e1" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 1.5rem">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <h2>Product Not Found</h2>
      <p>We couldn't find product #${id}. It may have been removed or the link is incorrect.</p>
      <a href="products.html" class="btn btn-primary" style="display:inline-flex;margin-top:1.5rem;">← Browse All Products</a>
    </div>
  `;
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  const id = getProductId();
  const product = PRODUCTS[id];
  const container = document.getElementById('product-page');

  if (product) {
    window.__currentProduct = product;
    container.innerHTML = renderProduct(product);
    document.title = `${product.name} — Univolt Power`;
  } else {
    container.innerHTML = renderNotFound(id || '?');
  }

  // Cart / nav helpers (from script.js pattern)
  setActiveNav();

  const cartOverlay = document.getElementById('cart-overlay');
  if (cartOverlay) cartOverlay.addEventListener('click', () => cart.closeCart());

  document.addEventListener('click', (e) => {
    const mobileMenu = document.getElementById('mobile-menu');
    const menuBtn = document.getElementById('mobile-menu-btn');
    if (mobileMenu && menuBtn && !mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
      mobileMenu.classList.remove('active');
    }
  });
});

function setActiveNav() {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
    if (link.getAttribute('href') === 'products.html') link.classList.add('active');
  });
}

function toggleMobileMenu() {
  document.getElementById('mobile-menu')?.classList.toggle('active');
}

function handleCheckout() {
  if (!cart || cart.cart.length === 0) {
    cart.showToast('Your cart is empty!');
    return;
  }
  cart.showToast('Checkout functionality coming soon!');
}
</script>
</body>
</html>
